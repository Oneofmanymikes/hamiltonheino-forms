<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
           margin: 0; padding: 16px; color: #1a1a1a; background: #f6f6f7; }
    .wrap { max-width: 620px; margin: 0 auto; }

    .login { max-width: 340px; margin: 8vh auto; background: #fff; padding: 24px;
             border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
    .login h1 { font-size: 1.1rem; margin: 0 0 4px; }
    .login p { color: #666; font-size: .85rem; margin: 0 0 16px; }
    label { display: block; margin: 10px 0 4px; font-size: .82rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc;
                              border-radius: 8px; font-size: 1rem; font-family: inherit; }
    button { padding: 11px 14px; background: #d71920; color: #fff; border: 0;
             border-radius: 8px; font-weight: 700; cursor: pointer; font-size: .95rem; }
    button[disabled] { opacity: .6; cursor: default; }
    .login button { width: 100%; margin-top: 14px; }
    .err { color: #8c1c1c; background: #fdecec; border: 1px solid #f2b8b8;
           padding: 9px; border-radius: 8px; font-size: .85rem; margin-top: 12px; display: none; }

    .stats { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat { background: #fff; border: 1px solid #e3e3e3; border-radius: 9px;
            padding: 7px 12px; font-size: .78rem; color: #666; }
    .stat b { display: block; font-size: 1.15rem; color: #1a1a1a; }

    .card { background: #fff; border-radius: 12px; border: 1px solid #e3e3e3;
            padding: 18px; margin-bottom: 12px; }
    .name { font-size: 1.4rem; font-weight: 700; margin: 0 0 2px; }
    .meta { color: #777; font-size: .8rem; margin-bottom: 12px; }
    /* The number is shown, not dialled — most callers are at a desk with a
       handset or a mobile in hand, and a tel: link does nothing on a desktop. */
    .tel { text-align: center; background: #f7f7f8; border: 2px solid #d71920;
           color: #1a1a1a; padding: 14px; border-radius: 10px; }
    .tel small { display: block; font-size: .68rem; font-weight: 700; color: #888;
                 letter-spacing: .09em; text-transform: uppercase; margin-bottom: 5px; }
    .telnum { font-size: 2rem; font-weight: 700; letter-spacing: .04em;
              user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; }
    .copy { margin-top: 8px; background: #fff; color: #444; border: 1px solid #ccc;
            font-size: .78rem; padding: 6px 12px; }

    .script { background: #fffdf3; border: 1px solid #f0e4bd; border-radius: 9px;
              padding: 13px; font-size: .9rem; line-height: 1.5; margin: 14px 0; }
    .script b { color: #7a5c00; }

    h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
         color: #666; margin: 16px 0 8px; }
    .outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .outcomes button { background: #fff; color: #222; border: 1px solid #ccc; font-weight: 600; }
    .outcomes button.yes { background: #157a3a; color: #fff; border-color: #157a3a; }
    .outcomes button.sel { outline: 3px solid #ffd4d6; border-color: #d71920; }

    .shiftpick { display: none; margin-top: 12px; }
    .shiftpick.on { display: block; }
    .day { border: 1px solid #e3e3e3; border-radius: 9px; margin-bottom: 8px; overflow: hidden; }
    .day-hd { background: #f7f7f8; padding: 7px 10px; font-weight: 600; font-size: .82rem; }
    .slot { display: flex; gap: 9px; align-items: center; padding: 8px 10px;
            border-top: 1px solid #eee; cursor: pointer; font-size: .87rem; }
    .slot input { width: 17px; height: 17px; accent-color: #d71920; }
    .note { color: #666; font-size: .78rem; }
    .done { text-align: center; padding: 40px 20px; }
    .done h2 { margin: 0 0 6px; }
    .msg { padding: 11px; border-radius: 8px; font-size: .88rem; margin-top: 10px; display: none; }
    .msg.ok { display: block; background: #eaf7ee; border: 1px solid #b7e0c4; color: #1c5c31; }
    .msg.bad { display: block; background: #fdecec; border: 1px solid #f2b8b8; color: #8c1c1c; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .topbar h1 { font-size: 1.05rem; margin: 0; flex: 1; }
    .topbar button { background: #fff; color: #333; border: 1px solid #ddd; font-size: .8rem; }

    /* page tabs: calling vs the shift week grid, on one screen */
    .ptabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .ptabs button { flex: 1; background: #e9e9ec; color: #444; font-size: .88rem; }
    .ptabs button.on { background: #d71920; color: #fff; }

    /* mission selector */
    .modes { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .modes button { background: #fff; color: #555; border: 1px solid #ccc;
                    font-size: .78rem; font-weight: 600; padding: 7px 11px; }
    .modes button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* week grid */
    .wk { background: #fff; border-radius: 12px; border: 1px solid #e3e3e3; padding: 14px; }
    .wkbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .wkbar h2 { font-size: .98rem; margin: 0; flex: 1; }
    .wkbar button { background: #fff; color: #333; border: 1px solid #ddd; font-size: .78rem; }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(135px, 1fr));
            gap: 7px; overflow-x: auto; }
    .col { border: 1px solid #e6e6e6; border-radius: 9px; min-width: 135px; }
    .col-hd { padding: 7px 9px; font-weight: 700; font-size: .78rem;
              border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .col-hd .n { color: #888; }
    .today .col-hd { background: #fff4f4; color: #b3151b; }
    .wslot { padding: 7px 9px; border-bottom: 1px solid #f4f4f4; }
    .wslot:last-child { border-bottom: 0; }
    .wslot-t { font-size: .73rem; font-weight: 700; color: #444;
               display: flex; justify-content: space-between; margin-bottom: 3px; }
    .cap { color: #999; }
    .cap.full { color: #b3151b; }
    .wp { font-size: .76rem; padding: 2px 0; }
    .wp .ph { color: #666; font-size: .71rem; user-select: all; -webkit-user-select: all; }
    .none { font-size: .73rem; color: #b0b0b0; font-style: italic; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="loginView" class="login">
  <h1>Phone bank</h1>
  <p>Campaign staff and volunteers. Sign in to start calling.</p>
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="username">
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')doLogin()">
  <button id="loginBtn" onclick="doLogin()">Sign in</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="appView" class="wrap" style="display:none">
  <div class="topbar">
    <h1>Volunteer recruitment</h1>
    <span class="note" id="who"></span>
    <button onclick="doLogout()">Sign out</button>
  </div>

  <div class="ptabs">
    <button id="tabCall" class="on" onclick="showTab('call')">📞 Calling</button>
    <button id="tabWeek" onclick="showTab('week')">🗓️ Shift week</button>
  </div>

  <div id="callPane">
    <div class="stats" id="stats"></div>
    <div class="modes">
      <button id="mEligible" class="on" onclick="setMode('eligible')">Everyone</button>
      <button id="mRecruit" onclick="setMode('recruit')">Recruit</button>
      <button id="mOnboard" onclick="setMode('onboard')">New volunteers</button>
      <button id="mActive" onclick="setMode('active')">Active volunteers</button>
      <button id="mCallback" onclick="setMode('callback')">Call-backs due</button>
      <button id="mLapsed" onclick="setMode('lapsed')">Lapsed</button>
    </div>
    <div id="stage"></div>
  </div>

  <div id="weekPane" style="display:none">
    <div class="wk">
      <div class="wkbar">
        <h2 id="wkRange">Week of &hellip;</h2>
        <button onclick="wkMove(-7)">&larr; Prev</button>
        <button onclick="wkThis()">This week</button>
        <button onclick="wkMove(7)">Next &rarr;</button>
      </div>
      <div class="grid" id="wkGrid"></div>
      <p class="note" id="wkTotals"></p>
    </div>
  </div>
</div>

<script>
  var TOKEN = sessionStorage.getItem('pbToken') || '';
  var CUR = null, OUTCOME = null, PICKED = {};
  var MODE = 'eligible', WK_START = null;

  /* ---------- page tabs + mission selector ---------- */
  function showTab(which) {
    document.getElementById('tabCall').className = which === 'call' ? 'on' : '';
    document.getElementById('tabWeek').className = which === 'week' ? 'on' : '';
    document.getElementById('callPane').style.display = which === 'call' ? '' : 'none';
    document.getElementById('weekPane').style.display = which === 'week' ? '' : 'none';
    if (which === 'week' && !WK_START) wkLoad(null);
  }

  function setMode(m) {
    MODE = m;
    var ids = { eligible: 'mEligible', recruit: 'mRecruit', onboard: 'mOnboard',
                active: 'mActive', callback: 'mCallback', lapsed: 'mLapsed' };
    for (var k in ids) document.getElementById(ids[k]).className = (k === m ? 'on' : '');
    // hand back whoever is on screen so they are not left claimed under the old mission
    if (CUR) google.script.run.releaseContact(TOKEN, CUR.contactId);
    next();
  }

  /* ---------- shift week grid (same page, no second tool) ---------- */
  function wkLoad(start) {
    google.script.run
      .withSuccessHandler(wkRender)
      .withFailureHandler(function () {
        document.getElementById('wkGrid').innerHTML =
          '<p class="none">Could not load the shift week.</p>';
      })
      .getWeekGrid(start, TOKEN);
  }

  function wkMove(delta) {
    var d = new Date(WK_START + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    wkLoad(ymd(d));
  }

  function wkThis() { wkLoad(null); }

  function wkRender(data) {
    WK_START = data.start;
    var todayStr = ymd(new Date()), grand = 0, html = '';

    document.getElementById('wkRange').textContent =
      'Week of ' + new Date(data.start + 'T00:00:00')
        .toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

    data.days.forEach(function (day) {
      grand += day.total;
      html += '<div class="col' + (day.date === todayStr ? ' today' : '') + '">' +
                '<div class="col-hd"><span>' + esc(day.label) + '</span>' +
                '<span class="n">' + day.total + '</span></div>';
      if (!day.slots.length) html += '<div class="wslot"><span class="none">No shifts</span></div>';
      day.slots.forEach(function (s) {
        var full = s.capacity > 0 && s.people.length >= s.capacity;
        html += '<div class="wslot"><div class="wslot-t"><span>' + esc(s.label) + '</span>' +
                '<span class="cap' + (full ? ' full' : '') + '">' + s.people.length +
                (s.capacity > 0 ? '/' + s.capacity : '') + '</span></div>';
        if (!s.people.length) {
          html += '<div class="none">nobody yet</div>';
        } else {
          s.people.forEach(function (p) {
            html += '<div class="wp">' + esc(p.first + ' ' + p.last) +
                    (p.phone ? '<br><span class="ph">' + esc(p.phone) + '</span>' : '') + '</div>';
          });
        }
        html += '</div>';
      });
      html += '</div>';
    });

    document.getElementById('wkGrid').innerHTML = html;
    document.getElementById('wkTotals').textContent =
      grand + (grand === 1 ? ' signup' : ' signups') + ' this week.';
  }

  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
           '-' + ('0' + d.getDate()).slice(-2);
  }

  if (TOKEN) { showApp(sessionStorage.getItem('pbName') || ''); refresh(); }

  window.addEventListener('beforeunload', function () {
    if (CUR && TOKEN) google.script.run.releaseContact(TOKEN, CUR.contactId);
  });

  // Keep my claim alive while a contact is open. Without this a call running
  // longer than the claim window releases the contact mid-conversation and a
  // second caller can be handed the same person.
  setInterval(function () {
    if (CUR && TOKEN) {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.takenOver) {
            msg('Another caller has taken this contact — finish up and hit Skip.', 'bad');
          }
        })
        .withFailureHandler(function () {})
        .renewClaim(TOKEN, CUR.contactId);
    }
  }, 60000);

  /* ---------- auth ---------- */
  function doLogin() {
    var b = document.getElementById('loginBtn');
    b.disabled = true; b.textContent = 'Signing in…';
    document.getElementById('loginErr').style.display = 'none';
    google.script.run
      .withSuccessHandler(function (res) {
        b.disabled = false; b.textContent = 'Sign in';
        if (!res || !res.ok) { loginErr((res && res.error) || 'Sign-in failed.'); return; }
        TOKEN = res.token;
        sessionStorage.setItem('pbToken', TOKEN);
        sessionStorage.setItem('pbName', res.name || '');
        showApp(res.name || ''); refresh();
      })
      .withFailureHandler(function () {
        b.disabled = false; b.textContent = 'Sign in';
        loginErr('Sign-in failed. Please try again.');
      })
      .staffLogin(document.getElementById('email').value,
                  document.getElementById('pw').value);
  }

  function doLogout() {
    if (CUR) google.script.run.releaseContact(TOKEN, CUR.contactId);
    google.script.run.staffLogout(TOKEN);
    sessionStorage.removeItem('pbToken'); sessionStorage.removeItem('pbName');
    location.reload();
  }

  function showApp(name) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appView').style.display = '';
    document.getElementById('who').textContent = name || '';
  }

  function loginErr(t) {
    var e = document.getElementById('loginErr');
    e.textContent = t; e.style.display = 'block';
  }

  function expired(e) {
    sessionStorage.removeItem('pbToken');
    document.getElementById('appView').style.display = 'none';
    document.getElementById('loginView').style.display = '';
    loginErr((e && e.message) ? String(e.message).replace(/^Error:\s*/, '') : 'Please sign in again.');
  }

  /* ---------- flow ---------- */
  function refresh() {
    google.script.run.withSuccessHandler(renderStats)
                     .withFailureHandler(function () {})
                     .getPhonebankStats(TOKEN);
    next();
  }

  function renderStats(s) {
    var g = s.seg || {};
    document.getElementById('mRecruit').textContent = 'Recruit (' + (g['Recruit'] || 0) + ')';
    document.getElementById('mOnboard').textContent = 'New volunteers (' + (g['New volunteer'] || 0) + ')';
    document.getElementById('mActive').textContent  = 'Active volunteers (' + (g['Active volunteer'] || 0) + ')';
    document.getElementById('mLapsed').textContent  = 'Lapsed (' + (s.lapsed || 0) + ')';

    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + s.remaining + '</b>callable now</div>' +
      '<div class="stat"><b>' + s.calledToday + '</b>called today</div>' +
      '<div class="stat"><b>' + s.booked + '</b>booked</div>' +
      '<div class="stat" title="Resting until a different time of day, or until tomorrow morning">' +
        '<b>' + (s.resting || 0) + '</b>resting</div>' +
      '<div class="stat" title="Four unanswered calls, or 30 days with no contact">' +
        '<b>' + (s.lapsed || 0) + '</b>lapsed</div>' +
      '<div class="stat"><b>' + s.total + '</b>on the list</div>';
  }

  function next() {
    CUR = null; OUTCOME = null; PICKED = {};
    document.getElementById('stage').innerHTML = '<div class="card note">Loading…</div>';
    google.script.run.withSuccessHandler(renderContact)
                     .withFailureHandler(expired)
                     .getNextContact(TOKEN, MODE);
  }

  function renderContact(c) {
    if (c && c.error) { document.getElementById('stage').innerHTML =
      '<div class="card msg bad" style="display:block">' + esc(c.error) + '</div>'; return; }
    if (!c || c.done) {
      document.getElementById('stage').innerHTML =
        '<div class="card done"><h2>All done 🎉</h2><p class="note">' +
        esc((c && c.message) || 'Nobody left to call.') + '</p>' +
        ((c && c.skippedCount)
          ? '<button class="copy" style="margin-top:12px" onclick="unskip()">' +
            'Bring back my ' + c.skippedCount + ' skipped contact' +
            (c.skippedCount === 1 ? '' : 's') + '</button>'
          : '') +
        '</div>';
      return;
    }
    CUR = c;

    var h = '<div class="card">' +
      '<p class="name">' + esc(c.first + ' ' + c.last) + '</p>' +
      '<p class="meta"><b>' + esc(c.segment || '') + '</b>' +
        (c.source ? ' · from ' + esc(c.source) : '') +
        (c.postal ? ' · ' + esc(c.postal) : '') +
        (c.attempts ? ' · ' + c.attempts + ' previous attempt' + (c.attempts > 1 ? 's' : '') : '') +
      '</p>' +
      '<div class="tel"><small>Call this number</small>' +
        '<div class="telnum" id="num">' + esc(c.phone) + '</div>' +
        '<button class="copy" onclick="copyNum()">Copy number</button>' +
      '</div>' +
      (c.notes ? '<p class="note" style="margin-top:10px;white-space:pre-line">' + esc(c.notes) + '</p>' : '') +
      '<div class="script">' + scriptFor(c) + '</div>' +

      '<h3>How did it go?</h3>' +
      '<div class="outcomes">' +
        '<button class="yes" onclick="pick(\'booked\',this)">✓ Yes — book a shift</button>' +
        '<button onclick="pick(\'maybe\',this)">Maybe later</button>' +
        '<button onclick="pick(\'noanswer\',this)">No answer</button>' +
        '<button onclick="pick(\'voicemail\',this)">Left voicemail</button>' +
        '<button onclick="pick(\'callback\',this)">Call back</button>' +
        '<button onclick="pick(\'declined\',this)">Not interested</button>' +
        '<button onclick="pick(\'wrong\',this)">Wrong number</button>' +
        '<button onclick="pick(\'dnc\',this)">Do not call</button>' +
      '</div>' +
      (c.attempts >= 2
        ? '<p class="note" style="margin-top:8px">Tried ' + c.attempts +
          ' times already — after ' + (4 - c.attempts) +
          ' more unanswered call' + ((4 - c.attempts) === 1 ? '' : 's') +
          ' they drop to the lapsed list.</p>'
        : '') +

      '<div id="pickWrap" class="shiftpick"><h3>Which shifts?</h3><div id="shifts"></div></div>' +

      '<div id="cbWrap" style="display:none"><label for="cbAt">Call back when?</label>' +
        '<input type="datetime-local" id="cbAt"></div>' +

      '<h3>Notes</h3><textarea id="notes" rows="2" placeholder="Anything worth remembering"></textarea>' +

      '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<button id="saveBtn" style="flex:1" onclick="save()">Save &amp; next</button>' +
        '<button style="background:#fff;color:#555;border:1px solid #ccc" onclick="skip()">Skip</button>' +
      '</div>' +
      '<div id="m" class="msg"></div>' +
    '</div>';

    document.getElementById('stage').innerHTML = h;
    renderShifts(c.shifts || []);
  }

  /* The ask is different depending on who you're calling — a cold recruit,
     someone who just volunteered, or a volunteer who has already been out. */
  function scriptFor(c) {
    var hi = '<b>Hi ' + esc(c.first) + ', it\'s [your name] calling from the ' +
             'Heino Doessing campaign.</b> ';
    if (c.segment === 'Active volunteer') {
      return hi + 'Thanks so much for the time you\'ve already given us' +
        (c.bookedBefore ? ' — I can see you\'ve been out with us before' : '') + '. ' +
        'We\'re booking the next round of canvass shifts and I wanted to see when ' +
        'you could come out again. <b>Would any of these suit you?</b>';
    }
    if (c.segment === 'New volunteer') {
      return hi + 'You signed up to volunteer with us — thank you, that\'s brilliant. ' +
        'I\'m calling to get you out for your first canvass shift. You\'ll be paired ' +
        'with someone experienced, we train you on the spot, and it\'s about two hours. ' +
        '<b>What day works best for you?</b>';
    }
    return hi + 'We\'re knocking on doors across Hamilton East&ndash;Stoney Creek ' +
      'ahead of the by-election, and we\'re looking for people to come out with us. ' +
      'It\'s about two hours, you always go out in pairs, and we train you first — ' +
      'no experience needed. <b>Is that something you\'d be up for?</b>';
  }

  function renderShifts(days) {
    var el = document.getElementById('shifts');
    if (!days.length) { el.innerHTML = '<p class="note">No shifts available to book.</p>'; return; }
    var h = '';
    days.forEach(function (d) {
      h += '<div class="day"><div class="day-hd">' + esc(d.label) + '</div>';
      d.shifts.forEach(function (s) {
        h += '<label class="slot"><input type="checkbox" value="' + esc(s.shiftId) +
             '" onchange="tog(this)"><span>' + esc(s.label) +
             (s.tight ? ' <span class="note">(' + s.remaining + ' left)</span>' : '') +
             '</span></label>';
      });
      h += '</div>';
    });
    el.innerHTML = h;
  }

  function tog(cb) { if (cb.checked) PICKED[cb.value] = true; else delete PICKED[cb.value]; }

  function pick(o, btn) {
    OUTCOME = o;
    var all = document.querySelectorAll('.outcomes button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
    btn.classList.add('sel');
    document.getElementById('pickWrap').className = 'shiftpick' + (o === 'booked' ? ' on' : '');
    document.getElementById('cbWrap').style.display = (o === 'callback') ? 'block' : 'none';
  }

  function save() {
    if (!OUTCOME) { msg('Pick an outcome first.', 'bad'); return; }
    var ids = Object.keys(PICKED);
    if (OUTCOME === 'booked' && !ids.length) { msg('Choose at least one shift.', 'bad'); return; }

    var b = document.getElementById('saveBtn');
    b.disabled = true; b.textContent = 'Saving…';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          b.disabled = false; b.textContent = 'Save & next';
          msg((res && res.error) || 'Could not save.', 'bad');
          return;
        }
        refresh();
      })
      .withFailureHandler(function (e) {
        b.disabled = false; b.textContent = 'Save & next';
        msg('Could not save. Please try again.', 'bad');
      })
      .saveCallOutcome(TOKEN, {
        contactId: CUR.contactId,
        outcome: OUTCOME,
        shiftIds: ids,
        notes: document.getElementById('notes').value,
        callbackAt: (document.getElementById('cbAt') || {}).value || ''
      });
  }

  function skip() {
    // skipContact, not releaseContact: releasing alone puts them straight back
    // at the top of the queue, so the skip has to be remembered server-side.
    google.script.run.withSuccessHandler(next).withFailureHandler(next)
                     .skipContact(TOKEN, CUR.contactId);
  }

  function unskip() {
    google.script.run.withSuccessHandler(function () { refresh(); })
                     .withFailureHandler(function () { refresh(); })
                     .clearMySkips(TOKEN);
  }

  function copyNum() {
    var n = document.getElementById('num');
    if (!n) return;
    var t = n.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(flashCopied, selectNum);
    } else {
      selectNum();
    }
  }

  function selectNum() {
    var n = document.getElementById('num');
    if (!n) return;
    var r = document.createRange(); r.selectNodeContents(n);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  function flashCopied() {
    var b = document.querySelector('.copy');
    if (!b) return;
    var old = b.textContent;
    b.textContent = 'Copied ✓';
    setTimeout(function () { b.textContent = old; }, 1500);
  }

  function msg(t, cls) {
    var m = document.getElementById('m');
    m.className = 'msg ' + cls; m.textContent = t;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
</script>
</body>
</html>
